<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380">
  <defs>
    <linearGradient id="clientG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="relayG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="380" fill="#fafafa" rx="8"/>

  <!-- Network cloud background -->
  <ellipse cx="280" cy="190" rx="200" ry="140" fill="#F3E8FF" opacity="0.5"/>

  <!-- Title -->
  <text x="280" y="35" text-anchor="middle" fill="#374151" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Relay Network Topology</text>

  <!-- Relay 1 (center top) -->
  <g filter="url(#shadowBox)">
    <rect x="220" y="90" width="120" height="55" rx="8" fill="url(#relayG)"/>
    <text x="280" y="118" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Relay 1</text>
    <text x="280" y="133" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="9">wss://relay1.com</text>
  </g>

  <!-- Relay 2 (center bottom) -->
  <g filter="url(#shadowBox)">
    <rect x="220" y="235" width="120" height="55" rx="8" fill="url(#relayG)"/>
    <text x="280" y="263" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Relay 2</text>
    <text x="280" y="278" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="9">wss://relay2.com</text>
  </g>

  <!-- Client A (top left) -->
  <g filter="url(#shadowBox)">
    <rect x="40" y="70" width="100" height="50" rx="8" fill="url(#clientG)"/>
    <text x="90" y="100" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Client A</text>
  </g>

  <!-- Client B (top right) -->
  <g filter="url(#shadowBox)">
    <rect x="420" y="70" width="100" height="50" rx="8" fill="url(#clientG)"/>
    <text x="470" y="100" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Client B</text>
  </g>

  <!-- Client C (bottom left) -->
  <g filter="url(#shadowBox)">
    <rect x="40" y="255" width="100" height="50" rx="8" fill="url(#clientG)"/>
    <text x="90" y="285" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Client C</text>
  </g>

  <!-- Client D (bottom right) -->
  <g filter="url(#shadowBox)">
    <rect x="420" y="255" width="100" height="50" rx="8" fill="url(#clientG)"/>
    <text x="470" y="285" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Client D</text>
  </g>

  <!-- Connection lines -->
  <g stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.7">
    <!-- Client A to Relay 1 -->
    <path d="M140 90 Q180 90 220 105"/>
    <!-- Client A to Relay 2 -->
    <path d="M140 105 Q160 180 220 255"/>

    <!-- Client B to Relay 1 -->
    <path d="M420 90 Q380 90 340 105"/>
    <!-- Client B to Relay 2 -->
    <path d="M420 105 Q400 180 340 255"/>

    <!-- Client C to Relay 1 -->
    <path d="M140 270 Q160 200 220 130"/>
    <!-- Client C to Relay 2 -->
    <path d="M140 280 Q180 280 220 270"/>

    <!-- Client D to Relay 1 -->
    <path d="M420 270 Q400 200 340 130"/>
    <!-- Client D to Relay 2 -->
    <path d="M420 280 Q380 280 340 270"/>

    <!-- Relay to Relay (optional sync) -->
    <path d="M280 145 L280 235" stroke-dasharray="5,3" opacity="0.5"/>
  </g>

  <!-- Legend -->
  <g transform="translate(180, 340)">
    <rect x="0" y="0" width="200" height="30" fill="white" rx="4" stroke="#e5e7eb"/>
    <circle cx="20" cy="15" r="6" fill="#8B5CF6"/>
    <text x="35" y="19" fill="#374151" font-family="system-ui, sans-serif" font-size="10">Client</text>
    <rect x="90" y="9" width="20" height="12" rx="3" fill="#A78BFA"/>
    <text x="115" y="19" fill="#374151" font-family="system-ui, sans-serif" font-size="10">Relay</text>
  </g>
</svg>